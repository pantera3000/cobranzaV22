{% extends 'base.html' %}

{% block title %}Sin permiso{% endblock %}

{% block content %}
<div class="text-center mt-5">
    <div class="mb-4">
        <i class="fas fa-ban text-danger" style="font-size: 4rem;"></i>
    </div>
    <h3>{{ titulo }}</h3>
    <p class="text-muted">{{ mensaje }}</p>

    <!-- Botón para volver -->
    {% if url_anterior %}
        <a href="{{ url_anterior|escape }}" class="btn btn-primary me-2">
            <i class="fas fa-arrow-left"></i> Volver atrás
        </a>
    {% endif %}

    <!-- Botón a Inicio -->
    <a href="{% url 'clientes:cliente_list' %}" class="btn btn-outline-secondary">
        <i class="fas fa-home"></i> Ir al inicio
    </a>
</div>
{% endblock %}
