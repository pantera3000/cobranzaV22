{% extends 'base.html' %}
{% block title %}Cerrar Planilla (Admin) {% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-lock"></i> Cerrar Planilla del Día (Admin)</h2>
    <a href="{% url 'cobros:admin_reporte_planillas' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Volver
    </a>
</div>

<div class="card">
    <div class="card-body">
        <p class="text-muted">Selecciona un cobrador para cerrar su planilla del día.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label>Cobrador:</label>
                <select name="cobrador" class="form-select" required>
                    <option value="">-- Seleccionar --</option>
                    {% for c in cobradores %}
                    <option value="{{ c.pk }}">{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Cerrar Planilla</button>
        </form>
    </div>
</div>
{% endblock %}
