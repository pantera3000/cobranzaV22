{% extends 'base.html' %}
{% block title %}Configurar Meta Mensual{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-bullseye"></i> 
        {% if created %}Crear Meta Mensual{% else %}Editar Meta Mensual{% endif %}
    </h2>
    <a href="{% url 'cobros:reporte_cartera' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Volver
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="monto_objetivo" class="form-label">Meta para {{ meta.mes|date:"F Y" }}</label>
                <input type="number" step="0.01" name="monto_objetivo" id="monto_objetivo"
                       class="form-control" value="{{ meta.monto_objetivo }}"
                       required min="0">
            </div>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Guardar Meta
            </button>
        </form>
    </div>
</div>
{% endblock %}
